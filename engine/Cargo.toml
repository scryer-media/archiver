[package]
name = "archive-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unicode-normalization = "=0.1.26"
sevenz-turbo = { version = "=0.30.3", default-features = false, features = ["aes256", "compress", "native-crypto", "ppmd", "bzip2", "zstd", "deflate", "lz4", "brotli"] }
unrar-rs = { version = "=0.16.5", default-features = false, features = ["crypto-rust"] }
par2-rs = { version = "=0.13.0", default-features = false, features = ["crypto-rust"] }
par3-rs = "=0.8.3"
lzma-stream = { package = "lzma-turbo", version = "=0.12.0", default-features = false, features = ["std", "xz", "enc", "native-crypto"] }
bzip2-turbo = "=0.2.1"
zstd = "=0.14.4"
brotli = { version = "=9.1.3", default-features = false, features = ["std"] }
lz4_flex = "=0.14.2"
flate2 = { version = "=1.1.11", features = ["zlib-rs"] }
lamfold = { version = "=0.1.5", default-features = false, features = ["std"] }
lamfold-iso = { version = "=0.1.2", default-features = false, features = ["std", "zisofs"] }
lamfold-udf = { version = "=0.1.1", default-features = false, features = ["std"] }
[profile.release]
opt-level = 3
lto = true
