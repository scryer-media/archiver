[package]
name = "archive-engine"
version = "0.1.0"
edition = "2024"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "=0.1.26"
sevenz-turbo = { version = "=0.30.3", default-features = false, features = ["aes256", "compress", "native-crypto", "ppmd", "bzip2", "zstd", "deflate", "lz4", "brotli"] }
unrar-rs = { path = "../../rarpar/crates/unrar-rs", default-features = false, features = ["crypto-rust"] }
par2-rs = { path = "../../rarpar/crates/par2-rs", default-features = false, features = ["crypto-rust"] }
par3-rs = { path = "../../rarpar/crates/par3-rs" }
lzma-stream = { package = "lzma-turbo", path = "../../lzma-turbo", default-features = false, features = ["std", "xz", "enc", "native-crypto"] }
bzip2-turbo = { path = "../../bzip2-turbo" }
zstd = "0.14"
brotli = { version = ">=7, <10", default-features = false, features = ["std"] }
lz4_flex = "0.14"
flate2 = { version = "1", features = ["zlib-rs"] }
[profile.release]
opt-level = 3
lto = true
